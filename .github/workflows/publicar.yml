# Arma el instalador de Windows y lo publica como Release de GitHub (etiqueta v<versión de package.json>).
# Se dispara solo cuando cambia package.json en main (por ejemplo, al subir "version": "1.0.1"),
# al subir una etiqueta v*, o a mano desde la pestaña Actions (Run workflow).
# Si la Release de esa versión ya existe, no se vuelve a publicar.
# Las copias instaladas de Jarvis se actualizan solas desde la Release más nueva.
name: Publicar versión

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/publicar.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Revisar que no haya datos personales
        run: node scripts/revisar-privacidad.js

      - name: Instalar dependencias
        run: npm ci

      - name: Armar y publicar (instalador + portable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis portable --x64 --publish always
