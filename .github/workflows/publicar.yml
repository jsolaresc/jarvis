# Arma el instalador de Windows y lo publica como Release de GitHub (etiqueta v<versión de package.json>).
# Se dispara cuando cambia package.json (o este archivo) en main, con una etiqueta v*, o a mano
# desde la pestaña Actions (Run workflow). Si la Release ya existe, reemplaza sus archivos.
# Las copias instaladas de Jarvis se actualizan solas desde la Release más nueva.
name: Publicar versión

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/publicar.yml', '.github/workflows/android.yml', 'build/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Revisar que no haya datos personales
        run: node scripts/revisar-privacidad.js

      - name: Instalar dependencias
        run: npm ci

      - uses: actions/setup-go@v5
        with:
          go-version-file: red/go.mod
          cache: false

      - name: Tailscale integrado (jarvis-red.exe, desde red/pc)
        shell: bash
        working-directory: red
        run: |
          go mod tidy
          go build -trimpath -ldflags "-s -w" -o ../build/red/jarvis-red.exe ./pc
          ls -la ../build/red

      - name: Anotar la fecha de esta versión
        shell: bash
        run: |
          printf '{ "fecha": "%s", "commit": "%s" }\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${GITHUB_SHA::7}" > src/main/version.json
          cat src/main/version.json

      - name: Armar el instalador
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Armar la versión portable
        continue-on-error: true
        run: npx electron-builder --win portable --x64 --publish never

      - name: Qué se armó
        shell: bash
        run: ls -la dist

      - name: Publicar en Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          T="v$V"
          NOTAS=$'**Para instalar:** bajá `Jarvis-Setup-'"$V"$'.exe` (no el .blockmap ni el .yml), abrilo y seguí los pasos.\n\nSi Windows muestra "Windows protegió su PC", tocá **Más información → Ejecutar de todas formas** (el instalador no está firmado).\n\nLa primera vez que abre, baja solo los componentes elegidos (la voz son ~530 MB). Después se actualiza solo.\n\n**App de Android:** bajá `Jarvis-'"$V"$'.apk` desde el celular e instalala (Android pide permiso para instalar apps de otros orígenes). En la PC: Ajustes → Dispositivos → Celular → Vincular un celular.'
          gh release view "$T" > /dev/null 2>&1 || gh release create "$T" --title "Jarvis $V" --notes "$NOTAS" --target "$GITHUB_SHA"
          gh release edit "$T" --notes "$NOTAS" --draft=false
          ARCHIVOS=("dist/Jarvis-Setup-$V.exe" "dist/Jarvis-Setup-$V.exe.blockmap" "dist/latest.yml")
          [ -f "dist/Jarvis-Portable-$V.exe" ] && ARCHIVOS+=("dist/Jarvis-Portable-$V.exe")
          for i in 1 2 3; do
            gh release upload "$T" "${ARCHIVOS[@]}" --clobber && exit 0
            echo "Falló la subida (intento $i), reintento en 20 s"; sleep 20
          done
          exit 1

  # La app de Android sale de la misma versión y se suma a la misma Release.
  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  subir-apk:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: salida
      - name: Sumar el .apk a la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          ls -la salida
          for i in 1 2 3; do
            gh release upload "v$V" salida/*.apk --clobber && exit 0
            echo "Falló la subida (intento $i), reintento en 20 s"; sleep 20
          done
          exit 1
